[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-matrix-cutter"
version = "0.1.0"
description = "Semantic rough-cut pipeline for turning one source video into topic-specific social cuts."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["video", "ffmpeg", "llm", "rough-cut", "social-media", "scenedetect", "whisper"]
authors = [
  {name = "video-matrix-cutter contributors"},
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
  "Topic :: Multimedia :: Video :: Conversion",
]
dependencies = [
  "openai>=1.60.0",
  "pydantic>=2.9.0",
  "PyYAML>=6.0.2",
  "python-dotenv>=1.0.1",
  "Pillow>=11.0.0",
  "scenedetect[opencv]>=0.7.1",
]

[project.optional-dependencies]
speech = ["faster-whisper>=1.1.0"]
dev = ["pytest>=8.3.0"]

[project.urls]
Homepage = "https://github.com/Chang-the-one/autoslice"
Issues = "https://github.com/Chang-the-one/autoslice/issues"
Source = "https://github.com/Chang-the-one/autoslice"

[project.scripts]
# Primary console script.
autoslice = "video_matrix.cli:main"
# Backwards-compatible alias for v0.1.x; kept because the original
# package name was video-matrix-cutter and some users already have
# muscle memory for `video-matrix ...`.
video-matrix = "video_matrix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
